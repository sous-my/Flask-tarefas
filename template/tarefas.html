<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    aqui fica a lista de tarefas 
    {{lista}}


    <div class="container">
        <h1>Lista de Tarefas</h1>

        <!-- Formulário para adicionar nova tarefa -->
        <form action="/add" method="post"> 
            <input type="text" name="nova">
            <button type="submit">Adicionar</button>
            
        </form>

        <!-- Exibição da lista de tarefas -->
        {% if tasks %}
            <ul class="task-list">
                {% for task in tasks %}
                    <li>
                        <span>{{ task }}</span>
                        <form action="{{ url_for('delete', task_id=loop.index0) }}" method="POST" class="delete-form">
                            <button type="submit" class="btn-delete">Excluir</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty-msg">Nenhuma tarefa cadastrada na sessão.</p>
        {% endif %}
    </div>
</body>
</html>
